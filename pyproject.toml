[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trystencil-url-tools"
version = "0.1.0"
description = "Offline URL builder for TryStencil tattoo generator, try-on, stencil, and idea pages. Not an official SDK."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "bbwdadfg" }]

[project.urls]
Homepage = "https://trystencil.org/"
Repository = "https://github.com/bbwdadfg/trystencil-url-tools"
Issues = "https://github.com/bbwdadfg/trystencil-url-tools/issues"

[tool.setuptools.packages.find]
where = ["python"]
include = ["trystencil_url_tools*"]
